<div class="container-fluid">
<div class="row">
    <div class="col-md-5 d-flex align-items-center justify-content-center">
        <img src="https://www.vecteezy.com/png/57445465-a-vibrant-illustrated-lion-head-logo-showcasing-rich-colors-and-unique-design-against-a-clean-transparent-background-colorful-3d-illustrated-lion-head-logo-on-transparent-background" alt="company logo">
        SmartConnect logo
    </div>
    <div class="col-md-7">
        <form [formGroup]="form">
            <div class="mb-3">
                <label for="" class="form-label">Name</label>
                <input type="text" class="form-control" formControlName="name" />
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Email</label>
                <input type="text" class="form-control" formControlName="email" />
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Mobile</label>
                <input type="text" class="form-control" formControlName="mobile" />
            </div>
            <div class="mb-3">
                <label class="form-label">Designation</label>
                <select class="form-select" formControlName="designation">
                    <option value="Angular Developer">Angular Developer</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="AWS Developer">AWS Developer</option>
                </select>
            </div>
            <div class="skill-section">
                <span class="skill-heading"><strong>Skills</strong> </span>
                <button class="btn btn-outline-primary" (click)="addSkill()">Add</button>
            </div>
            <div formArrayName="skills">
                <div *ngFor="let skill of skills.controls; let i = index" [formGroupName]="i" class="skill-row">
                    <div class="mb-3">
                        <label for="" class="form-label">Skill Name</label>
                        <input type="text" class="form-control" formControlName="skillName">
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Experience</label>
                        <input type="number" class="form-control" formControlName="experience">
                    </div>
                    <div class="mt-4">
                        <button class="btn btn-outline-secondary" (click)="removeSkill(i)">Remove</button>
                    </div>
                </div>
            </div>
            
            <div class="mb-3 mt-5">
                <button class="btn btn-primary form-control" (click)="save()">Submit</button>
            </div>
        </form>
    </div>
</div>
</div>
