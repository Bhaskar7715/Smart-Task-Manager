<mat-toolbar color="primary" class="app-header">

  <!-- Logo / Title -->
  <span class="logo" routerLink="/">
    <mat-icon>dashboard</mat-icon>
    My App
  </span>

  <!-- Nav links -->
  <nav class="nav-links">
  <a routerLink="/home" routerLinkActive="active">Home</a>
  <a routerLink="/bank" routerLinkActive="active">Bank</a>
  <a routerLink="/tasks" routerLinkActive="active">Tasks</a>
  <a routerLink="/registration" routerLinkActive="active">Registration</a>
  <a routerLink="/users" routerLinkActive="active">Users</a>
  <a routerLink="/smart" routerLinkActive="active">Smart</a>
  <a routerLink="/dump" routerLinkActive="active">Dump</a>
  <a routerLink="/skill" routerLinkActive="active">Skill</a>
  <a routerLink="/employee" routerLinkActive="active">Employee</a>
  <a routerLink="/todo" routerLinkActive="active">Todo</a>
  <a routerLink="/switchmap" routerLinkActive="active">Switchmap</a>
  <a routerLink="/bootstrap" routerLinkActive="active">Bootstrap</a>
  <a routerLink="/password" routerLinkActive="active">Password</a>
</nav>

  <span class="spacer"></span>

  <!-- User dropdown -->
  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="menu-user-name">{{ userName }}</div>
    <mat-divider></mat-divider>

    <button mat-menu-item (click)="onProfile('Profile')">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>

    <button mat-menu-item (click)="onSettings('Setting')">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="onLogout('Log-out')">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>

</mat-toolbar>
